version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: designdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_CONNECTION: "Host=db;Port=5432;Database=designdocs;Username=postgres;Password=postgres"
    ports:
      - "8090:8090"
    volumes:
      - ../backend:/src
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8090
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:
